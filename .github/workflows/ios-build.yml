# 排班空间 PaiBan — 云端 Mac 编译（不用买 Mac）
# 用法：推到 GitHub 私有仓库后，Actions 自动编出未签名的 PaiBan.ipa
# （Artifacts 里下载，保留 30 天）。
# 编出来的是未签名 .ipa，拿企业证书重签后装到手机上，一年有效。
# GitHub 免费额度：公开仓库无限，私有仓库每月 2000 分钟，macOS 按 10 倍计费，
# 一次编译约 5 分钟 ≈ 50 分钟额度，一个月够跑几十次。
name: Build PaiBan IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Decode app icons
        run: |
          for f in tools/icons/*.b64; do
            base64 -D -i "$f" -o "PaiBan/Assets.xcassets/AppIcon.appiconset/$(basename "$f" .b64)"
          done
          ls -lh PaiBan/Assets.xcassets/AppIcon.appiconset/

      - name: Archive (unsigned)
        run: |
          xcodebuild -project PaiBan.xcodeproj \
            -scheme PaiBan \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PaiBan.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/PaiBan.xcarchive/Products/Applications/PaiBan.app Payload/
          zip -r PaiBan.ipa Payload
          ls -lh PaiBan.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaiBan-ipa
          path: PaiBan.ipa
          retention-days: 30
